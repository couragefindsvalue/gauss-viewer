<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Gauss Contest Viewer</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100dvh; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #1e293b; color: #fff; display: flex; flex-direction: column;
}

/* ---------- Header ---------- */
.header {
  padding: 10px 16px; background: #0f172a;
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0; border-bottom: 1px solid #334155;
  gap: 10px; flex-wrap: wrap;
}
.header h1 { font-size: 18px; color: #f8fafc; white-space: nowrap; }

.year-select {
  background: #1e293b; color: #f1f5f9; border: 1px solid #475569;
  padding: 10px 14px; border-radius: 8px; font-size: 15px; font-weight: 600;
  cursor: pointer; outline: none;
  -webkit-appearance: none; appearance: none;
  padding-right: 32px;
  background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='3'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e");
  background-repeat: no-repeat; background-position: right 8px center; background-size: 14px;
}
.year-select:hover { border-color: #64748b; }
.header .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.btn {
  background: #3b82f6; color: #fff; border: none;
  padding: 10px 18px; border-radius: 8px; font-size: 15px; font-weight: 600;
  cursor: pointer; transition: background .15s; user-select: none;
  -webkit-tap-highlight-color: transparent; min-width: 80px;
}
.btn:hover:not(:disabled) { background: #2563eb; }
.btn:disabled { opacity: 0.3; cursor: not-allowed; }
.btn.active { background: #10b981; }
.btn.active:hover { background: #059669; }
.btn.wb-toggle { background: #8b5cf6; min-width: 90px; }
.btn.wb-toggle:hover { background: #7c3aed; }
.btn.wb-toggle.active { background: #10b981; }

.zoom-controls {
  display: flex; gap: 4px; align-items: center;
  background: #1e293b; border-radius: 8px; padding: 3px; border: 1px solid #475569;
}
.zoom-btn {
  background: transparent; color: #f1f5f9; border: none;
  width: 34px; height: 34px; border-radius: 6px;
  font-size: 20px; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  user-select: none; -webkit-tap-highlight-color: transparent; transition: background .15s;
}
.zoom-btn:hover { background: #334155; }
.zoom-btn:active { background: #475569; }
.zoom-level {
  font-size: 13px; font-weight: 600; color: #cbd5e1;
  min-width: 48px; text-align: center; font-variant-numeric: tabular-nums;
  cursor: pointer; user-select: none; padding: 0 4px;
}
.zoom-level:hover { color: #f1f5f9; }

/* ---------- Viewer ---------- */
.viewer-container {
  position: relative; flex: 1; overflow: auto; background: #334155;
  -webkit-overflow-scrolling: touch; text-align: center; padding: 0;
  touch-action: pan-x pan-y;
}
.canvas-wrapper {
  display: inline-block; position: relative;
  line-height: 0; vertical-align: top;
}
.canvas-wrapper img {
  display: block;
  width: auto; max-width: none; height: auto;
  transition: opacity 0.2s;
  user-select: none; -webkit-user-drag: none;
}
#draw-canvas {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  touch-action: none;
}
body.draw-mode #draw-canvas { pointer-events: auto; cursor: crosshair; }
body.draw-mode .viewer-container { touch-action: none; }

/* ---------- 白板工具栏 ---------- */
.whiteboard-toolbar {
  display: none;
  padding: 10px 16px;
  background: #111827;
  border-top: 1px solid #334155;
  align-items: center;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  flex-shrink: 0;
}
.whiteboard-toolbar.visible { display: flex; }

.wb-btn {
  width: 40px; height: 40px; border-radius: 50%;
  border: 2px solid #475569; background: #1e293b;
  color: #f1f5f9; font-size: 18px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all .15s; user-select: none; -webkit-tap-highlight-color: transparent;
  padding: 0;
}
.wb-btn:hover { border-color: #94a3b8; }
.wb-btn.active { border-color: #3b82f6; border-width: 3px; transform: scale(1.1); }
.wb-color { width: 36px; height: 36px; border-radius: 50%; border: 3px solid #475569; cursor: pointer; }
.wb-color.active { border-color: #fff; transform: scale(1.15); }

.wb-sep {
  width: 1px; height: 28px; background: #334155; margin: 0 6px;
}
.wb-size {
  -webkit-appearance: none; appearance: none;
  width: 100px; height: 6px; border-radius: 3px;
  background: #334155; outline: none; cursor: pointer;
}
.wb-size::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 20px; height: 20px; border-radius: 50%;
  background: #3b82f6; cursor: pointer; border: 2px solid #fff;
}
.wb-size::-moz-range-thumb {
  width: 20px; height: 20px; border-radius: 50%;
  background: #3b82f6; cursor: pointer; border: 2px solid #fff;
}

/* ---------- 底部导航 ---------- */
.question-nav {
  padding: 14px 20px;
  padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  background: #0f172a; display: flex; align-items: center; justify-content: center;
  gap: 20px; flex-shrink: 0; border-top: 1px solid #334155; z-index: 20;
}
.question-nav .counter {
  font-size: 20px; font-weight: 600; color: #f1f5f9;
  min-width: 110px; text-align: center; font-variant-numeric: tabular-nums;
}

.toast {
  position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
  background: rgba(239, 68, 68, 0.9); padding: 10px 20px; border-radius: 8px;
  font-size: 14px; display: none; z-index: 100; max-width: 90vw; text-align: center;
}
</style>
</head>
<body>

<div class="header">
  <h1>📘 Gauss</h1>
  <select class="year-select" id="year-select" onchange="onYearChange()"></select>

  <div class="zoom-controls">
    <button class="zoom-btn" onclick="zoomOut()" title="Zoom out">−</button>
    <span class="zoom-level" id="zoom-level" onclick="resetZoom()" title="Click to reset">100%</span>
    <button class="zoom-btn" onclick="zoomIn()" title="Zoom in">+</button>
  </div>

  <div class="controls">
    <button class="btn active" id="btn-question" onclick="switchType('questions')">Questions</button>
    <button class="btn" id="btn-solution" onclick="switchType('solutions')">Solutions</button>
    <button class="btn wb-toggle" id="btn-wb" onclick="toggleWhiteboard()">✏️ Whiteboard</button>
  </div>
</div>

<div class="viewer-container" id="viewer">
  <div class="canvas-wrapper" id="canvas-wrapper">
    <img id="page-image" alt="Page" onload="onImageLoad()" onerror="onImageError()">
    <canvas id="draw-canvas"></canvas>
  </div>
</div>

<!-- 白板工具栏 -->
<div class="whiteboard-toolbar" id="wb-toolbar">
  <div class="wb-color active" style="background:#ef4444" data-color="#ef4444" onclick="setColor(this)"></div>
  <div class="wb-color" style="background:#3b82f6" data-color="#3b82f6" onclick="setColor(this)"></div>
  <div class="wb-color" style="background:#10b981" data-color="#10b981" onclick="setColor(this)"></div>
  <div class="wb-color" style="background:#f59e0b" data-color="#f59e0b" onclick="setColor(this)"></div>
  <div class="wb-color" style="background:#0f172a" data-color="#0f172a" onclick="setColor(this)"></div>

  <div class="wb-sep"></div>

  <button class="wb-btn" id="wb-eraser" onclick="toggleEraser()" title="Eraser">🧽</button>
  <input type="range" class="wb-size" id="wb-size" min="2" max="24" value="4" oninput="penSize = +this.value">

  <div class="wb-sep"></div>

  <button class="wb-btn" onclick="undoStroke()" title="Undo">↶</button>
  <button class="wb-btn" onclick="clearStrokes()" title="Clear page">🗑️</button>
</div>

<div class="question-nav">
  <button class="btn" id="btn-prev" onclick="prevPage()" disabled>← Prev</button>
  <span class="counter" id="counter">0 / 0</span>
  <button class="btn" id="btn-next" onclick="nextPage()">Next →</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   全局状态
============================================================ */
let metadata = null;
let currentYear = null;
let currentType = 'questions';
const pageMemory = {};

let zoomLevel = 100;
const ZOOM_MIN = 50;
const ZOOM_MAX = 400;
const ZOOM_STEP = 25;

let pinchStartDist = 0;
let pinchStartZoom = 100;
let isPinching = false;
let pinchReleaseTimer = null;

/* 白板状态 */
let drawingEnabled = false;
let penColor = '#ef4444';
let penSize = 4;
let isEraser = false;
let isDrawing = false;
let currentStroke = null;
const drawings = {};       // key -> { strokes: [] }
const activePointers = new Set();

const canvas = document.getElementById('draw-canvas');
const ctx = canvas.getContext('2d');

/* ============================================================
   初始化
============================================================ */
async function init() {
  try {
    const res = await fetch('/data/gauss/years.json');
    const years = await res.json();

    if (years.length === 0) {
      showToast('❌ No year data found.');
      return;
    }

    const select = document.getElementById('year-select');
    select.innerHTML = '';
    years.forEach(y => {
      const opt = document.createElement('option');
      opt.value = y; opt.textContent = y;
      select.appendChild(opt);
    });

    currentYear = years[0];
    select.value = currentYear;
    await loadYear(currentYear);

    setupPinchZoom();
    setupCanvasEvents();
    window.addEventListener('resize', () => applyZoom());
  } catch (e) {
    showToast(`❌ Initialization failed: ${e.message}`);
    console.error(e);
  }
}

async function loadYear(year) {
  try {
    const res = await fetch(`/data/gauss/${year}/metadata.json`);
    if (!res.ok) throw new Error(`Year ${year} not found`);
    metadata = await res.json();
    if (!pageMemory[year]) pageMemory[year] = { questions: 0, solutions: 0 };
    switchType(currentType);
  } catch (e) {
    showToast(`❌ Failed to load ${year}: ${e.message}`);
    console.error(e);
  }
}

function onYearChange() {
  currentYear = document.getElementById('year-select').value;
  loadYear(currentYear);
}

/* ============================================================
   缩放
============================================================ */
function applyZoom() {
  const img = document.getElementById('page-image');
  const viewer = document.getElementById('viewer');
  if (!img || !viewer) return;
  if (!img.naturalWidth) return;

  const baseWidth = viewer.clientWidth;
  const targetWidth = baseWidth * (zoomLevel / 100);
  img.style.width = `${targetWidth}px`;
  img.style.maxWidth = 'none';
  document.getElementById('zoom-level').textContent = `${zoomLevel}%`;
}

function zoomIn() {
  if (zoomLevel >= ZOOM_MAX) return;
  zoomLevel = Math.min(ZOOM_MAX, zoomLevel + ZOOM_STEP);
  applyZoom();
}
function zoomOut() {
  if (zoomLevel <= ZOOM_MIN) return;
  zoomLevel = Math.max(ZOOM_MIN, zoomLevel - ZOOM_STEP);
  applyZoom();
}
function resetZoom() { zoomLevel = 100; applyZoom(); }

function setupPinchZoom() {
  const viewer = document.getElementById('viewer');
  if (!viewer) return;

  viewer.addEventListener('touchstart', (e) => {
    if (drawingEnabled) return;   // 白板模式禁用捏合缩放
    if (e.touches.length === 2) {
      isPinching = true;
      if (pinchReleaseTimer) { clearTimeout(pinchReleaseTimer); pinchReleaseTimer = null; }
      pinchStartDist = getDistance(e.touches[0], e.touches[1]);
      pinchStartZoom = zoomLevel;
    }
  }, { passive: true });

  viewer.addEventListener('touchmove', (e) => {
    if (drawingEnabled) return;
    if (e.touches.length === 2 && isPinching && pinchStartDist > 0) {
      e.preventDefault();
      const dist = getDistance(e.touches[0], e.touches[1]);
      const ratio = dist / pinchStartDist;
      const newZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, Math.round(pinchStartZoom * ratio)));
      if (newZoom !== zoomLevel) { zoomLevel = newZoom; applyZoom(); }
    }
  }, { passive: false });

  viewer.addEventListener('touchend', (e) => {
    if (e.touches.length < 2 && isPinching) {
      if (pinchReleaseTimer) clearTimeout(pinchReleaseTimer);
      pinchReleaseTimer = setTimeout(() => { isPinching = false; pinchStartDist = 0; }, 500);
    }
  });

  let lastTap = 0;
  viewer.addEventListener('touchend', (e) => {
    if (drawingEnabled) return;
    if (isPinching || pinchReleaseTimer) return;
    if (e.touches.length !== 0) return;
    const now = Date.now();
    if (now - lastTap < 300) { resetZoom(); lastTap = 0; } else { lastTap = now; }
  });
}

function getDistance(t1, t2) {
  const dx = t1.clientX - t2.clientX;
  const dy = t1.clientY - t2.clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

/* ============================================================
   页面渲染
============================================================ */
function getImages() {
  if (!metadata) return {};
  return currentType === 'questions'
    ? (metadata.question_images || {})
    : (metadata.solution_images || {});
}

function getCurrentPage() {
  if (!pageMemory[currentYear]) pageMemory[currentYear] = { questions: 0, solutions: 0 };
  return pageMemory[currentYear][currentType];
}
function setCurrentPage(page) {
  if (!pageMemory[currentYear]) pageMemory[currentYear] = { questions: 0, solutions: 0 };
  pageMemory[currentYear][currentType] = page;
}

function switchType(type) {
  if (!metadata) return;
  currentType = type;
  document.getElementById('btn-question').classList.toggle('active', type === 'questions');
  document.getElementById('btn-solution').classList.toggle('active', type === 'solutions');

  const images = getImages();
  const totalPages = Object.keys(images).length;
  let savedPage = getCurrentPage();
  if (savedPage >= totalPages) savedPage = 0;
  setCurrentPage(savedPage);
  renderPage();
}

function renderPage() {
  const images = getImages();
  const totalPages = Object.keys(images).length;
  const currentPage = getCurrentPage();
  const imagePath = images[currentPage];

  if (!imagePath) {
    document.getElementById('page-image').removeAttribute('src');
    document.getElementById('counter').textContent = `0 / 0`;
    showToast('⚠️ Image not found for this page');
    return;
  }

  document.getElementById('counter').textContent = `${currentPage + 1} / ${totalPages}`;
  document.getElementById('btn-prev').disabled = currentPage <= 0;
  document.getElementById('btn-next').disabled = currentPage >= totalPages - 1;

  const parts = imagePath.split(/[\/\\]/);
  const filename = parts[parts.length - 1];
  const fullPath = `/data/gauss/${currentYear}/${currentType}/${filename}`;

  const img = document.getElementById('page-image');
  img.style.opacity = '0.5';
  img.style.width = 'auto';
  img.src = fullPath;
}

function onImageLoad() {
  const img = document.getElementById('page-image');
  img.style.opacity = '1';
  document.getElementById('viewer').scrollTop = 0;

  // 同步 canvas 像素尺寸 = 图片自然尺寸
  if (img.naturalWidth && img.naturalHeight) {
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
  }
  redraw();
  applyZoom();
}

function onImageError() {
  const img = document.getElementById('page-image');
  if (!img.getAttribute('src')) return;
  console.error('Image failed to load:', img.src);
  showToast(`❌ Image failed to load`);
}

function prevPage() {
  const currentPage = getCurrentPage();
  if (currentPage > 0) { setCurrentPage(currentPage - 1); renderPage(); }
}
function nextPage() {
  const images = getImages();
  const totalPages = Object.keys(images).length;
  const currentPage = getCurrentPage();
  if (currentPage < totalPages - 1) { setCurrentPage(currentPage + 1); renderPage(); }
}

/* ============================================================
   白板核心
============================================================ */
function getPageKey() {
  return `${currentYear}__${currentType}__${getCurrentPage()}`;
}
function getDrawingData() {
  const key = getPageKey();
  if (!drawings[key]) drawings[key] = { strokes: [] };
  return drawings[key];
}

function toggleWhiteboard() {
  drawingEnabled = !drawingEnabled;
  document.body.classList.toggle('draw-mode', drawingEnabled);
  document.getElementById('btn-wb').classList.toggle('active', drawingEnabled);
  document.getElementById('wb-toolbar').classList.toggle('visible', drawingEnabled);
  showToast(drawingEnabled ? '✏️ Whiteboard ON' : '👁️ Whiteboard OFF');
}

function setColor(el) {
  document.querySelectorAll('.wb-color').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  penColor = el.dataset.color;
  isEraser = false;
  document.getElementById('wb-eraser').classList.remove('active');
}

function toggleEraser() {
  isEraser = !isEraser;
  document.getElementById('wb-eraser').classList.toggle('active', isEraser);
}

/* 坐标映射：client → canvas 像素 */
function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY
  };
}

function setupCanvasEvents() {
  canvas.addEventListener('pointerdown', (e) => {
    if (!drawingEnabled) return;
    activePointers.add(e.pointerId);

    // 多指按下时取消当前笔画（防误触）
    if (activePointers.size > 1) {
      if (currentStroke) {
        const data = getDrawingData();
        const idx = data.strokes.indexOf(currentStroke);
        if (idx >= 0) data.strokes.splice(idx, 1);
        currentStroke = null;
        isDrawing = false;
        redraw();
      }
      return;
    }

    e.preventDefault();
    canvas.setPointerCapture(e.pointerId);
    isDrawing = true;
    currentStroke = {
      color: penColor,
      size: isEraser ? penSize * 4 : penSize,
      eraser: isEraser,
      points: [getCanvasPos(e)]
    };
    getDrawingData().strokes.push(currentStroke);
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!isDrawing || !currentStroke || !drawingEnabled) return;
    e.preventDefault();
    const pos = getCanvasPos(e);
    const pts = currentStroke.points;
    const last = pts[pts.length - 1];

    // 距离过滤：避免点太密
    const dx = pos.x - last.x, dy = pos.y - last.y;
    if (dx * dx + dy * dy < 4) return;

    pts.push(pos);
    drawSegment(last, pos, currentStroke);
  });

  const endDraw = (e) => {
    activePointers.delete(e.pointerId);
    if (isDrawing && currentStroke) {
      isDrawing = false;
      currentStroke = null;
    }
  };
  canvas.addEventListener('pointerup', endDraw);
  canvas.addEventListener('pointercancel', endDraw);
  canvas.addEventListener('pointerleave', endDraw);
}

function drawSegment(from, to, stroke) {
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.lineWidth = stroke.size;
  if (stroke.eraser) {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.strokeStyle = 'rgba(0,0,0,1)';
  } else {
    ctx.strokeStyle = stroke.color;
  }
  ctx.beginPath();
  ctx.moveTo(from.x, from.y);
  ctx.lineTo(to.x, to.y);
  ctx.stroke();
  ctx.restore();
}

function redraw() {
  if (!canvas.width || !canvas.height) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const data = getDrawingData();
  data.strokes.forEach(stroke => {
    const pts = stroke.points;
    if (pts.length === 0) return;
    if (pts.length === 1) {
      // 单点：画一个圆点
      ctx.save();
      ctx.fillStyle = stroke.eraser ? 'rgba(0,0,0,1)' : stroke.color;
      if (stroke.eraser) ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.arc(pts[0].x, pts[0].y, stroke.size / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      return;
    }
    for (let i = 1; i < pts.length; i++) {
      drawSegment(pts[i - 1], pts[i], stroke);
    }
  });
}

function undoStroke() {
  const data = getDrawingData();
  if (data.strokes.length === 0) return;
  data.strokes.pop();
  redraw();
}

function clearStrokes() {
  const data = getDrawingData();
  if (data.strokes.length === 0) return;
  if (!confirm('Clear all drawings on this page?')) return;
  data.strokes = [];
  redraw();
}

/* ============================================================
   键盘
============================================================ */
document.addEventListener('keydown', (e) => {
  if (drawingEnabled) {
    // 白板模式下：Z 撤销，E 橡皮，Esc 退出
    if (e.key === 'z' || e.key === 'Z') { undoStroke(); return; }
    if (e.key === 'e' || e.key === 'E') { toggleEraser(); return; }
    if (e.key === 'Escape') { toggleWhiteboard(); return; }
  }
  if (e.key === 'ArrowLeft') prevPage();
  if (e.key === 'ArrowRight') nextPage();
  if (e.key === '+' || e.key === '=') zoomIn();
  if (e.key === '-' || e.key === '_') zoomOut();
  if (e.key === '0') resetZoom();
});

/* ============================================================
   Toast
============================================================ */
let toastTimer = null;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.style.display = 'block';
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.style.display = 'none'; }, 2500);
}

init();
</script>
</body>
</html>
